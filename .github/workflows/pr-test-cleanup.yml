name: Retire PR Temporary Build

on:
  pull_request_target:
    branches: [dev]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary script
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test "$PR_NUMBER" -gt 0
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "sudo rm -f /opt/1panel/www/sites/aimarker-suite-ota/index/ota/dev/prtest/$PR_NUMBER.user.js"
      - name: Update installation comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const marker = '<!-- ai-marker-prtest -->';
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: `${marker}\n当前 PR 的临时测试已结束。` });
